name: Release source archive
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Check tag and privacy
        run: |
          python -B -c "import json,os,sys; from pathlib import Path; v=json.loads(Path('plugins/ultra-hook/plugin.json').read_text())['version']; sys.exit(0 if os.environ['RELEASE_TAG']=='v'+v else 'Tag and manifest version differ')"
          python -B scripts/audit_release.py --git-staged --git-history --allow-github-noreply-identities
      - name: Build audited artifact
        run: python -B scripts/build_release.py --output "$RUNNER_TEMP/ultra-hook-release"
      - name: Attest release provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/ultra-hook-release/*.zip
          create-storage-record: false
      - name: Publish tag artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" "$RUNNER_TEMP/ultra-hook-release/"*.zip "$RUNNER_TEMP/ultra-hook-release/"*.sha256 --verify-tag --generate-notes --title "Ultra Hook $RELEASE_TAG"
